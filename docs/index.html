<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정책평가팀 HR</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="app.css?v=58c69d59dc">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo"><img src="kosi_logo.png" alt="KOSI" onerror="this.replaceWith('KOSI')"></div>
      <div class="brand-text"><b id="teamName">정책평가팀</b><small>HR 관리</small></div>
    </div>
    <nav class="nav">
      <div class="nav-group">메인</div>
      <a href="#dashboard" data-page="dashboard"><span class="ico">▦</span>대시보드</a>
      <a href="#notices" data-page="notices"><span class="ico">✎</span>공지사항<span class="badge" id="navNotice"></span></a>
      <div class="nav-group">업무</div>
      <a href="#tasks" data-page="tasks"><span class="ico">☰</span>팀주간업무</a>
      <a href="#personal" data-page="personal"><span class="ico">✓</span>개인별업무</a>
      <a href="#reviews" data-page="reviews"><span class="ico">⚖</span>협의검토</a>
      <a href="#duty" data-page="duty"><span class="ico">▤</span>업무분장</a>
      <div class="nav-group">인사</div>
      <a href="#leave" data-page="leave"><span class="ico">✈</span>복무관리<span class="badge" id="navLeave"></span></a>
      <div class="nav-group">공용</div>
      <a href="#pclog" data-page="pclog"><span class="ico">🖥</span>공용 PC 사용대장</a>
    </nav>
    <div class="sidebar-foot">
      <div class="user-box" id="userBox"></div>
      <button class="btn-ghost" id="btnReload" title="엑셀 파일을 다시 읽습니다">⟳ 엑셀 새로고침</button>
      <div class="sync" id="syncInfo">-</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="메뉴">☰</button>
      <h1 id="pageTitle">대시보드</h1>
      <div class="topbar-right" id="todayLabel"></div>
    </header>
    <div id="errorBox" class="error-box" hidden></div>
    <section class="page" id="page-dashboard"></section>
    <section class="page" id="page-notices" hidden></section>
    <section class="page" id="page-duty" hidden></section>
    <section class="page" id="page-tasks" hidden></section>
    <section class="page" id="page-personal" hidden></section>
    <section class="page" id="page-reviews" hidden></section>
    <section class="page" id="page-pclog" hidden></section>
    <section class="page" id="page-leave" hidden></section>
  </main>
</div>

<dialog id="formDialog"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>window.HR_STATIC = true;</script>
<script src="app.js?v=3fedaf7ce7"></script>
</body>
</html>
